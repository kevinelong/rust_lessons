[package]
name = "rust_lessons"
version = "0.18.0"
edition = "2021"
description = "Introduction to programming, taught in Rust: the same lessons as the Python, Java and JavaScript courses"
license-file = "LICENSE.md"
publish = false
default-run = "rust_lessons"

[lib]
name = "rust_lessons"
path = "src/lib.rs"

# The one dependency: a recorded session is data, and reading data should not be
# hand-rolled. Both crates are already in the local registry cache, so `cargo test`
# builds offline.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "rust_lessons"
path = "src/main.rs"

[profile.release]
strip = true
