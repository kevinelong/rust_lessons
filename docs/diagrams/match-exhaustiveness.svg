<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="Exhaustive match: every variant of the enum must have an arm; a missing variant is a compile error, and a catch-all hides future variants.">
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .h { fill: #1f2328; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .s { fill: #57606a; font-family: system-ui, sans-serif; font-size: 12px; }
      .t { fill: #1f2328; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
      .var { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.3; }
      .arm { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.3; }
      .miss { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.3; }
      .ln { stroke: #57606a; stroke-width: 1.4; fill: none; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="320" fill="#ffffff" fill-opacity="0.98" rx="10"/>
  <text class="h" x="24" y="34">A match must cover every variant — the compiler counts for you</text>

  <text class="s" x="24" y="62">the enum</text>
  <rect class="var" x="24" y="72" width="150" height="26" rx="5"/><text class="t" x="36" y="90">Shake::Vanilla</text>
  <rect class="var" x="24" y="104" width="150" height="26" rx="5"/><text class="t" x="36" y="122">Shake::Chocolate</text>
  <rect class="var" x="24" y="136" width="150" height="26" rx="5"/><text class="t" x="36" y="154">Shake::Strawberry</text>

  <path class="ln" marker-end="url(#ar6)" d="M 178 85 L 236 85"/>
  <path class="ln" marker-end="url(#ar6)" d="M 178 117 L 236 117"/>
  <path class="ln" marker-end="url(#ar6)" d="M 178 149 L 236 149"/>

  <text class="s" x="240" y="62">the arms</text>
  <rect class="arm" x="240" y="72" width="180" height="26" rx="5"/><text class="t" x="252" y="90">Vanilla =&gt; 350</text>
  <rect class="arm" x="240" y="104" width="180" height="26" rx="5"/><text class="t" x="252" y="122">Chocolate =&gt; 400</text>
  <rect class="arm" x="240" y="136" width="180" height="26" rx="5"/><text class="t" x="252" y="154">Strawberry =&gt; 375</text>

  <!-- complete -->
  <rect class="card" x="470" y="66" width="320" height="104" rx="8"/>
  <text class="s" x="486" y="88">complete: compiles</text>
  <text class="t" x="486" y="112">3 variants, 3 arms</text>
  <text class="s" x="486" y="134">add a fourth variant to the enum and</text>
  <text class="s" x="486" y="150">this match stops compiling. That is the</text>
  <text class="s" x="486" y="166">point: the compiler lists the work.</text>

  <!-- incomplete -->
  <rect class="card" x="24" y="196" width="360" height="106" rx="8"/>
  <text class="s" x="40" y="218">incomplete: error[E0004]</text>
  <text class="t" x="40" y="242">Strawberry =&gt; not covered</text>
  <rect class="miss" x="40" y="252" width="180" height="24" rx="4"/>
  <text class="t" x="52" y="269">non-exhaustive patterns</text>
  <text class="s" x="40" y="292">the fix is an arm, not a wildcard</text>

  <!-- wildcard -->
  <rect class="card" x="402" y="196" width="388" height="106" rx="8"/>
  <text class="s" x="418" y="218">catch-all: compiles, and is a trap</text>
  <text class="t" x="418" y="242">_ =&gt; 0,</text>
  <text class="s" x="418" y="266">A new variant silently prices at zero.</text>
  <text class="s" x="418" y="282">Use _ only when the value genuinely does</text>
  <text class="s" x="418" y="298">not matter — never to silence the compiler.</text>
</svg>
