<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Iterators are lazy: map and filter describe work, and nothing runs until a consumer such as collect, sum or count asks for values.">
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .h { fill: #1f2328; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .s { fill: #57606a; font-family: system-ui, sans-serif; font-size: 12px; }
      .t { fill: #1f2328; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
      .lazy { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.3; }
      .use { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.3; }
      .src { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.3; }
      .ln { stroke: #57606a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="300" fill="#ffffff" fill-opacity="0.98" rx="10"/>
  <text class="h" x="24" y="34">Iterators are lazy: describe the work, then ask for the result</text>

  <rect class="src" x="24" y="112" width="120" height="52" rx="6"/>
  <text class="t" x="38" y="134">1..=1_000_000</text>
  <text class="s" x="38" y="152">a recipe, not a list</text>

  <path class="ln" marker-end="url(#ar4)" d="M 148 138 L 208 138"/>
  <rect class="lazy" x="212" y="112" width="120" height="52" rx="6"/>
  <text class="t" x="226" y="134">.filter(|x| …)</text>
  <text class="s" x="226" y="152">nothing runs yet</text>

  <path class="ln" marker-end="url(#ar4)" d="M 336 138 L 396 138"/>
  <rect class="lazy" x="400" y="112" width="120" height="52" rx="6"/>
  <text class="t" x="414" y="134">.map(|x| x * x)</text>
  <text class="s" x="414" y="152">still nothing</text>

  <path class="ln" marker-end="url(#ar4)" d="M 524 138 L 584 138"/>
  <rect class="use" x="588" y="112" width="140" height="52" rx="6"/>
  <text class="t" x="602" y="134">.collect()</text>
  <text class="s" x="602" y="152">this is what runs it</text>

  <text class="s" x="24" y="74">lazy stages</text>
  <path d="M 210 82 L 576 82" stroke="#9a6700" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="s" x="580" y="74">consuming stage</text>

  <text class="s" x="24" y="204">Same chain, other consumers:</text>
  <text class="t" x="24" y="226">.sum()   .count()   .max()   .for_each(..)   .take(5).collect()</text>
  <text class="s" x="24" y="252">An infinite range stays safe only because a consumer stops it:</text>
  <text class="t" x="24" y="274">(1u64..).map(|x| x * x).take(5).collect()</text>
</svg>
