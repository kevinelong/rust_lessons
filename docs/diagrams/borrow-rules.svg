<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Borrowing rules: many shared borrows, or exactly one mutable borrow, never both at once.">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .h { fill: #1f2328; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .s { fill: #57606a; font-family: system-ui, sans-serif; font-size: 12px; }
      .t { fill: #1f2328; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
      .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.3; }
      .no { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.3; }
      .val { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.3; }
      .ln { stroke: #57606a; stroke-width: 1.4; fill: none; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="300" fill="#ffffff" fill-opacity="0.98" rx="10"/>
  <text class="h" x="24" y="34">Borrowing: many readers, or exactly one writer — never both at once</text>

  <!-- allowed: many & -->
  <rect class="card" x="20" y="56" width="350" height="216" rx="8"/>
  <text class="s" x="36" y="80">allowed: any number of &amp;</text>
  <rect class="val" x="150" y="140" width="90" height="34" rx="5"/><text class="t" x="176" y="162">text</text>
  <rect class="ok" x="36" y="98" width="64" height="26" rx="5"/><text class="t" x="50" y="116">&amp;text</text>
  <rect class="ok" x="36" y="140" width="64" height="26" rx="5"/><text class="t" x="50" y="158">&amp;text</text>
  <rect class="ok" x="36" y="182" width="64" height="26" rx="5"/><text class="t" x="50" y="200">&amp;text</text>
  <path class="ln" marker-end="url(#ar2)" d="M 104 111 L 146 150"/>
  <path class="ln" marker-end="url(#ar2)" d="M 104 153 L 146 157"/>
  <path class="ln" marker-end="url(#ar2)" d="M 104 195 L 146 168"/>
  <text class="s" x="36" y="240">reading is fine in company: nobody</text>
  <text class="s" x="36" y="256">can change the value under the others.</text>

  <!-- allowed: one &mut -->
  <rect class="card" x="386" y="56" width="176" height="216" rx="8"/>
  <text class="s" x="402" y="80">allowed: one &amp;mut</text>
  <rect class="val" x="440" y="140" width="90" height="34" rx="5"/><text class="t" x="466" y="162">text</text>
  <rect class="ok" x="402" y="140" width="30" height="26" rx="5"/><text class="t" x="406" y="158">&amp;m</text>
  <path class="ln" marker-end="url(#ar2)" d="M 436 153 L 436 157"/>
  <text class="s" x="402" y="200">alone, it may change</text>
  <text class="s" x="402" y="216">the value safely.</text>

  <!-- refused -->
  <rect class="card" x="578" y="56" width="182" height="216" rx="8"/>
  <text class="s" x="594" y="80">refused</text>
  <rect class="no" x="594" y="98" width="64" height="26" rx="5"/><text class="t" x="608" y="116">&amp;text</text>
  <rect class="no" x="594" y="140" width="64" height="26" rx="5"/><text class="t" x="598" y="158">&amp;mut</text>
  <path d="M 596 100 L 660 168 M 660 100 L 596 168" stroke="#cf222e" stroke-width="1.6"/>
  <text class="s" x="594" y="200">a reader and a writer</text>
  <text class="s" x="594" y="216">at the same time is the</text>
  <text class="s" x="594" y="232">bug Rust removed.</text>
</svg>
