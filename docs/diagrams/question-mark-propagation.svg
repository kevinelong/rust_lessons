<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="The question-mark operator: the error leaves the inner function early and travels up the call chain, skipping the rest of each caller's body until a function returns Result to its own caller.">
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="ar5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .h { fill: #1f2328; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .s { fill: #57606a; font-family: system-ui, sans-serif; font-size: 12px; }
      .t { fill: #1f2328; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      .frame { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.3; }
      .bad { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.4; }
      .skip { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; stroke-dasharray: 4 3; }
      .err { stroke: #cf222e; stroke-width: 1.8; fill: none; }
      .ok { stroke: #57606a; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="340" fill="#ffffff" fill-opacity="0.98" rx="10"/>
  <text class="h" x="24" y="34">? returns the error to the caller — it does not handle it</text>

  <!-- main -->
  <rect class="frame" x="24" y="60" width="470" height="70" rx="6"/>
  <text class="t" x="38" y="84">fn main()</text>
  <text class="s" x="38" y="104">let total = order_total(&amp;lines)?;   </text>
  <text class="s" x="300" y="104">← receiver of the error</text>

  <!-- order_total -->
  <rect class="frame" x="24" y="150" width="470" height="70" rx="6"/>
  <text class="t" x="38" y="174">fn order_total(lines) -&gt; Result&lt;u64, OrderError&gt;</text>
  <text class="s" x="38" y="194">lines.iter().map(|l| line_total(l)?).collect::&lt;Result&lt;Vec&lt;_&gt;, _&gt;&gt;()?</text>

  <!-- line_total -->
  <rect class="frame" x="24" y="240" width="470" height="70" rx="6"/>
  <text class="t" x="38" y="264">fn line_total(item, qty) -&gt; Result&lt;u64, OrderError&gt;</text>
  <text class="bad" x="38" y="276" width="300" height="24" rx="4"/>
  <text class="t" x="48" y="292">Err(Unknown("caviar"))  ← the failure is created here</text>

  <!-- the error travelling up -->
  <path class="err" marker-end="url(#ar5)" d="M 500 258 C 560 258, 560 200, 500 200"/>
  <text class="s" x="566" y="214">? at line_total</text>
  <text class="s" x="566" y="230">hands it to order_total</text>

  <path class="err" marker-end="url(#ar5)" d="M 500 182 C 560 182, 560 108, 500 108"/>
  <text class="s" x="566" y="128">? at order_total</text>
  <text class="s" x="566" y="144">hands it to main</text>

  <text class="s" x="566" y="94">nothing below runs</text>
  <text class="s" x="566" y="76">after a ? that fails</text>

  <!-- skipped work -->
  <rect class="skip" x="510" y="262" width="180" height="22" rx="4"/>
  <text class="s" x="518" y="278">remaining order lines: skipped</text>
  <rect class="skip" x="510" y="24" width="180" height="22" rx="4"/>
  <text class="s" x="518" y="40">the sum after collect: skipped</text>
</svg>
